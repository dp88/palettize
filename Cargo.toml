[package]
name = "palettize"
version = "0.1.0"
edition = "2024"
description = "Command-line utility for applying ordered Bayer dithering to images"
license = "MIT"
repository = "https://github.com/dp88/palettize"
keywords = ["dithering", "image", "bayer", "palette", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"

[dev-dependencies]
tempfile = "3"
