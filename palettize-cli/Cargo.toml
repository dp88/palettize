[package]
name = "palettize-cli"
version = "0.2.0"
edition = "2024"
description = "CLI for applying ordered Bayer dithering to images with custom color palettes"
license = "MIT"
repository = "https://github.com/dp88/palettize"
keywords = ["dithering", "image", "bayer", "palette", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "palettize"
path = "src/main.rs"

[dependencies]
palettize = { path = "../palettize" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"

[dev-dependencies]
tempfile = "3"
