[package]
name = "palettize-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for applying ordered Bayer dithering to images with custom color palettes"
license.workspace = true
repository.workspace = true
keywords = ["dithering", "image", "bayer", "palette", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"
exclude = ["tests/"]

[lints]
workspace = true

[[bin]]
name = "palettize"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image.workspace = true
palettize = { path = "../palettize", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"
